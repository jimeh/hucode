version = 1
name = "hucode"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"

if command -v mise >/dev/null 2>&1 && [ -f mise.toml ]; then
	mise trust mise.toml
fi

mise run treeboot
'''

[[actions]]
name = "Hucode Watch"
icon = "tool"
command = "npm run hucode:watch"

[[actions]]
name = "Hucode Run"
icon = "tool"
command = "npm run hucode:run"

[[actions]]
name = "Hucode Build"
icon = "tool"
command = "npm run hucode:build:release"
