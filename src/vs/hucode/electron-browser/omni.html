<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;

					'self'

					'unsafe-eval'

					'self'

					'self'

					ws:

					'self'

					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'

				trusted-types
