name: Setup Hucode Linux CI
description: Prepare Node.js, node_modules, and Linux packages for Hucode CI jobs.

inputs:
  github-token:
    description: Token used by npm install scripts when the cache is cold.
    required: true
  apt-packages:
    description: Newline-separated apt packages to install.
    required: false
    default: |
      build-essential
      libkrb5-dev
      libnotify-bin
      libx11-dev
      libx11-xcb-dev
      libxkbfile-dev
      pkg-config

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .nvmrc

    - name: Prepare node_modules cache key
      shell: bash
      run: |
        mkdir -p .build
        NODE_ARCH=$(node -p process.arch)
        node build/azure-pipelines/common/computeNodeModulesCacheKey.ts \
          hucode-linux x64 "$NODE_ARCH" \
          > .build/packagelockhash

    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .build/node_modules_cache
        key: "node_modules-hucode-linux-${{ hashFiles('.build/packagelockhash') }}"

    - name: Extract node_modules cache
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      shell: bash
      run: tar -xzf .build/node_modules_cache/cache.tgz

    - name: Install Linux packages
      if: ${{ inputs.apt-packages != '' }}
      shell: bash
      run: |
        packages=$(cat <<'PACKAGES'
        ${{ inputs.apt-packages }}
        PACKAGES
        )
        sudo apt-get update
        sudo apt-get install -y $packages

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e

        for i in {1..5}; do
          npm ci && break
          if [ "$i" -eq 5 ]; then
            echo "Npm install failed too many times" >&2
            exit 1
          fi
          echo "Npm install failed $i, trying again..."
        done
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
