name: Hucode release build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - linux-armhf
          - win32-x64
          - win32-arm64
      sign:
        description: Sign and notarize macOS release assets
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'tag' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  VSCODE_QUALITY: stable

jobs:
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select targets
        id: matrix
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          node <<'NODE'
          const targets = [
            {
              platform: 'darwin',
              arch: 'x64',
              npm_arch: 'x64',
              rust_target: 'x86_64-apple-darwin',
              runner: 'macos-15-intel',
              artifacts: 'archive,dmg'
            },
            {
              platform: 'darwin',
              arch: 'arm64',
              npm_arch: 'arm64',
              rust_target: 'aarch64-apple-darwin',
              runner: 'macos-15',
              artifacts: 'archive,dmg'
            },
            {
              platform: 'linux',
              arch: 'x64',
              npm_arch: 'x64',
              openssl_arch: 'x64-linux',
              rust_target: 'x86_64-unknown-linux-gnu',
              runner: 'ubuntu-latest',
              artifacts: 'archive,deb,rpm'
            },
            {
              platform: 'linux',
              arch: 'arm64',
              npm_arch: 'arm64',
              openssl_arch: 'arm64-linux',
              rust_target: 'aarch64-unknown-linux-gnu',
              runner: 'ubuntu-24.04-arm',
              artifacts: 'archive,deb,rpm'
            },
            {
              platform: 'linux',
              arch: 'armhf',
              npm_arch: 'arm',
              openssl_arch: 'arm-linux',
              rust_target: 'armv7-unknown-linux-gnueabihf',
              runner: 'ubuntu-latest',
              artifacts: 'archive,deb,rpm'
            },
            {
              platform: 'win32',
              arch: 'x64',
              npm_arch: 'x64',
              openssl_arch: 'x64-windows-static',
              rust_target: 'x86_64-pc-windows-msvc',
              runner: 'windows-latest',
              artifacts: 'archive,user-setup,system-setup'
            },
            {
              platform: 'win32',
              arch: 'arm64',
              npm_arch: 'arm64',
              openssl_arch: 'arm64-windows-static',
              rust_target: 'aarch64-pc-windows-msvc',
              runner: 'windows-11-arm',
              artifacts: 'archive,user-setup,system-setup'
            }
          ];
          const target = process.env.TARGET;
          const include = target === 'all'
            ? targets
            : targets.filter(item => `${item.platform}-${item.arch}` === target);
          const output = `matrix=${JSON.stringify({ include })}\n`;
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, output);
          NODE

  copilot-vsix:
    name: Build Copilot VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/copilot/package-lock.json

      - name: Setup emsdk
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/dev
          sudo chown "$USER" /opt/dev
          extensions/copilot/build/setup-emsdk.sh
          {
            echo "/opt/dev/emsdk/upstream/emscripten"
            echo "/opt/dev/emsdk"
          } >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-workspaces
          npm ci --prefix extensions/copilot
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Copilot extension
        run: npm run build
        working-directory: extensions/copilot

      - name: Minify Copilot JSON files
        shell: bash
        working-directory: extensions/copilot
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { parse } = require('jsonc-parser');
          const files = new Set();

          function add(file) {
            if (fs.existsSync(file) && fs.statSync(file).isFile()) {
              files.add(file);
            }
          }

          function addMatchingFiles(dir, pattern) {
            if (!fs.existsSync(dir)) {
              return;
            }

            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isFile() && pattern.test(entry.name)) {
                files.add(file);
              }
            }
          }

          add('package.json');
          add('package.nls.json');
          add('telemetry.json');
          addMatchingFiles('.', /^package\.nls\..+\.json$/);
          addMatchingFiles('l10n', /^bundle\.l10n\..+\.json$/);
          addMatchingFiles('dist', /\.json$/);

          for (const file of files) {
            console.log(`Minifying ${file}`);
            const contents = fs.readFileSync(file, 'utf8');
            const errors = [];
            const parsed = parse(contents, errors);
            if (errors.length) {
              throw new Error(
                `Failed to parse ${file}: ${JSON.stringify(errors)}`
              );
            }

            fs.writeFileSync(file, JSON.stringify(parsed, null, 0));
          }
          NODE

      - name: Package Copilot VSIX
        run: npx vsce package -o copilot-chat.vsix --allow-package-secrets sendgrid
        working-directory: extensions/copilot

      - name: Upload Copilot VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hucode-copilot-vsix
          path: extensions/copilot/copilot-chat.vsix
          if-no-files-found: error
          retention-days: 14

  app-build:
    name: Build app (${{ matrix.platform }}-${{ matrix.arch }})
    needs:
      - prepare-matrix
      - copilot-vsix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Determine build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          describe="$(git describe --tags --match 'v*.*.*' --always --dirty)"
          version="${describe#v}"
          safe_version="$(printf '%s' "$version" | tr '/: ' '---')"
          {
            echo "describe=$describe"
            echo "safe_version=$safe_version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release tag version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          hucode_version="$(node -p "require('./build/hucode/mixin/stable/product.json').hucodeVersion")"
          if [ "$tag_version" != "$hucode_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match hucodeVersion $hucode_version" >&2
            exit 1
          fi

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            file \
            libkrb5-dev \
            libnotify-bin \
            libssl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            pkg-config \
            rpm \
            zip

          if [ "${{ matrix.arch }}" = "armhf" ]; then
            sudo apt-get install -y \
              gcc-arm-linux-gnueabihf \
              g++-arm-linux-gnueabihf \
              libc6-dev-armhf-cross
          fi

      - name: Download OpenSSL prebuilt
        if: matrix.platform == 'linux' || matrix.platform == 'win32'
        shell: bash
        run: |
          set -euo pipefail
          openssl_root="$PWD/.build/hucode/openssl"
          mkdir -p "$openssl_root"
          tarball="$(npm pack @vscode/openssl-prebuilt@0.0.11 --pack-destination "$openssl_root")"
          tar -xzf "$openssl_root/$tarball" \
            --strip-components=1 \
            --directory="$openssl_root"
          openssl_arch_root="$openssl_root/out/${{ matrix.openssl_arch }}"
          if [ ! -d "$openssl_arch_root/lib" ]; then
            echo "OpenSSL prebuilt not found: $openssl_arch_root" >&2
            exit 1
          fi

          openssl_lib_dir="$openssl_arch_root/lib"
          openssl_include_dir="$openssl_arch_root/include"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            openssl_lib_dir="$(cygpath -w "$openssl_lib_dir")"
            openssl_include_dir="$(cygpath -w "$openssl_include_dir")"
          fi

          {
            echo "OPENSSL_LIB_DIR=$openssl_lib_dir"
            echo "OPENSSL_INCLUDE_DIR=$openssl_include_dir"
            if [ "${{ matrix.platform }}" = "win32" ]; then
              echo "OPENSSL_STATIC=1"
            fi
          } >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: matrix.platform == 'darwin'
        run: python3 -m pip install --user --break-system-packages setuptools

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          rustup default "$RUSTUP_TOOLCHAIN"
          rustup target add "${{ matrix.rust_target }}"
          rustc --version
          cargo --version
        env:
          RUSTUP_TOOLCHAIN: "1.88"

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Download Linux sysroot
        if: matrix.platform == 'linux' && matrix.arch != 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sysroot_arch="${{ matrix.arch }}"
          if [ "$sysroot_arch" = "x64" ]; then
            sysroot_arch="amd64"
          fi
          export VSCODE_SYSROOT_DIR="$PWD/.build/sysroots"
          export VSCODE_SYSROOT_PREFIX="-glibc-2.28-gcc-10.5.0"
          {
            echo "VSCODE_SYSROOT_DIR=$VSCODE_SYSROOT_DIR"
            echo "VSCODE_SYSROOT_PREFIX=$VSCODE_SYSROOT_PREFIX"
          } >> "$GITHUB_ENV"
          SYSROOT_ARCH="$sysroot_arch" \
            node -e 'import { getVSCodeSysroot } from "./build/linux/debian/install-sysroot.ts"; (async () => { await getVSCodeSysroot(process.env["SYSROOT_ARCH"]); })()'

      - name: Prepare Hucode mixin
        run: npm run hucode:prepare

      - name: Validate Hucode mixin
        run: npm run hucode:validate

      - name: Prepare built-in extensions cache key
        shell: bash
        run: |
          mkdir -p .build
          node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Copilot VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hucode-copilot-vsix
          path: .build/hucode/copilot

      - name: Build release app
        run: |
          set -euo pipefail
          node build/hucode/release-build.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --phase build \
            --copilot-vsix ".build/hucode/copilot/copilot-chat.vsix" \
            --out ".build/hucode/release/${{ steps.version.outputs.safe_version }}"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release app
        shell: bash
        run: |
          set -euo pipefail
          app_name="VSCode-${{ matrix.platform }}-${{ matrix.arch }}"
          app_path="../$app_name"
          archive=".build/hucode/app/${app_name}.tar"
          if [ ! -d "$app_path" ]; then
            echo "Release app output not found: $app_path" >&2
            exit 1
          fi

          mkdir -p "$(dirname "$archive")"
          tar -cf "$archive" -C .. "$app_name"

      - name: Upload release app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hucode-app-${{ steps.version.outputs.safe_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/hucode/app/VSCode-${{ matrix.platform }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs:
      - prepare-matrix
      - app-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Determine build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          describe="$(git describe --tags --match 'v*.*.*' --always --dirty)"
          version="${describe#v}"
          safe_version="$(printf '%s' "$version" | tr '/: ' '---')"
          {
            echo "describe=$describe"
            echo "safe_version=$safe_version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release tag version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          hucode_version="$(node -p "require('./build/hucode/mixin/stable/product.json').hucodeVersion")"
          if [ "$tag_version" != "$hucode_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match hucodeVersion $hucode_version" >&2
            exit 1
          fi

      - name: Validate macOS signing configuration
        if: matrix.platform == 'darwin' && (github.event_name == 'push' || inputs.sign)
        shell: bash
        env:
          APPLE_NOTARIZATION_ISSUER_ID: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_KEY_ID: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_NOTARIZATION_ISSUER_ID \
            APPLE_NOTARIZATION_KEY_ID \
            APPLE_NOTARIZATION_KEY_P8_BASE64 \
            APPLE_TEAM_ID \
            MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 \
            MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "$name is required for macOS signing" >&2
              exit 1
            fi
          done

      - name: Install Linux package tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            file \
            libkrb5-dev \
            libnotify-bin \
            libssl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            pkg-config \
            rpm \
            zip

          if [ "${{ matrix.arch }}" = "armhf" ]; then
            sudo apt-get install -y \
              gcc-arm-linux-gnueabihf \
              g++-arm-linux-gnueabihf \
              libc6-dev-armhf-cross
          fi

      - name: Install macOS packaging tools
        if: matrix.platform == 'darwin'
        run: python3 -m pip install --user --break-system-packages setuptools

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Download release app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hucode-app-${{ steps.version.outputs.safe_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/hucode/app

      - name: Restore release app
        shell: bash
        run: |
          set -euo pipefail
          app_name="VSCode-${{ matrix.platform }}-${{ matrix.arch }}"
          archive=".build/hucode/app/${app_name}.tar"
          rm -rf "../$app_name"
          tar -xf "$archive" -C ..

      - name: Package release artifacts
        run: |
          set -euo pipefail
          sign_args=()
          if [ "${{ matrix.platform }}" = "darwin" ] && \
            [ "$HUCODE_SIGN_RELEASE" = "true" ]; then
            sign_args+=(--sign)
          fi

          node build/hucode/release-build.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --phase package \
            --artifacts "${{ matrix.artifacts }}" \
            --out ".build/hucode/release/${{ steps.version.outputs.safe_version }}" \
            "${sign_args[@]}"
        shell: bash
        env:
          APPLE_NOTARIZATION_ISSUER_ID: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_KEY_ID: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUCODE_SIGN_RELEASE: ${{ github.event_name == 'push' || inputs.sign }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}

      - name: Report release size
        run: |
          node build/hucode/release-size-report.js \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --app "../VSCode-${{ matrix.platform }}-${{ matrix.arch }}" \
            --out ".build/hucode/release/${{ steps.version.outputs.safe_version }}/size-report-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            --markdown-out ".build/hucode/release/${{ steps.version.outputs.safe_version }}/size-report-${{ matrix.platform }}-${{ matrix.arch }}.md" \
            --copilot-node-modules-warn-mb 100
        shell: bash

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hucode-${{ steps.version.outputs.safe_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/hucode/release/${{ steps.version.outputs.safe_version }}/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release (disabled by default)
    if: github.event_name == 'push' && vars.HUCODE_ENABLE_RELEASE_PUBLISH == 'true'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "Hucode release build artifacts."
          fi

          mapfile -t files < <(find release-artifacts -type f \
            ! -path '*/hucode-app-*/*' \
            ! -path '*/hucode-copilot-vsix/*')
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
