# A separate install root: the renderer's React, Tailwind, and Vitest toolchain is bundled into
# media/, and must not hoist into, or share a lockfile with, the built-in extensions.
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: false
dedupePeerDependents: false
fetchTimeout: 180000
engineStrict: false
minimumReleaseAge: 10080
strictDepBuilds: true
sideEffectsCache: false
verifyDepsBeforeRun: false
pmOnFail: ignore
skills:
  dirs: []
allowBuilds:
  esbuild@0.28.2: true
